<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Genesis I — Logbook Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',monospace;background:#0a0f1e;color:#c8d8e8;
     min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:420px;padding:40px 36px;background:#101828;border:1px solid #1e3050;border-radius:4px}
.hdr{text-align:center;margin-bottom:32px;border-bottom:1px solid #1e3050;padding-bottom:22px}
.vlbl{font-size:10px;letter-spacing:4px;color:#4a7fa5;text-transform:uppercase;margin-bottom:8px}
.ttl{font-size:17px;font-weight:bold;letter-spacing:2px;color:#e0eaf4;text-transform:uppercase}
.sub{font-size:9px;color:#3a5a7a;letter-spacing:3px;margin-top:5px}
label{display:block;font-size:9px;letter-spacing:3px;color:#4a7fa5;text-transform:uppercase;margin-bottom:7px}
select{width:100%;padding:10px 14px;background:#0a1520;border:1px solid #1e3050;border-radius:2px;
       color:#c8d8e8;font-family:'Courier New',monospace;font-size:14px;appearance:none;cursor:pointer;outline:none}
select:focus{border-color:#4a7fa5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.info{background:#0a1520;border:1px solid #1e3050;border-radius:2px;padding:12px 14px;
      font-size:12px;color:#8aacca;line-height:1.9;margin-bottom:28px}
.info span{color:#4a9fd4}
.btn{width:100%;padding:14px;background:#1a3a5c;border:1px solid #2a5a8c;border-radius:2px;
     color:#7ec8f0;font-family:'Courier New',monospace;font-size:13px;letter-spacing:2px;
     text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn:hover{background:#1e4a70;border-color:#3a7ab0;color:#aad8f8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.prog{display:none;margin-top:16px}
.pbw{background:#0a1520;border:1px solid #1e3050;border-radius:2px;overflow:hidden}
.pb{height:3px;background:#4a9fd4;width:0%;transition:width .1s}
.pt{font-size:10px;color:#4a7fa5;letter-spacing:2px;text-align:center;padding:7px}
.done{display:none;margin-top:12px;font-size:11px;color:#5abf8a;letter-spacing:2px;text-align:center;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <div class="vlbl">MPSV Genesis I</div>
    <div class="ttl">Logbook Generator</div>
    <div class="sub">Operations Logbook — PDF</div>
  </div>
  <div class="row">
    <div><label>Mês</label>
      <select id="sm">
        <option value="0">Janeiro</option><option value="1">Fevereiro</option>
        <option value="2">Março</option><option value="3">Abril</option>
        <option value="4">Maio</option><option value="5">Junho</option>
        <option value="6">Julho</option><option value="7">Agosto</option>
        <option value="8">Setembro</option><option value="9">Outubro</option>
        <option value="10">Novembro</option><option value="11">Dezembro</option>
      </select></div>
    <div><label>Ano</label><select id="sy"></select></div>
  </div>
  <div class="info" id="inf">— selecione o mês e ano —</div>
  <button class="btn" id="btn" onclick="go()">▶ Gerar PDF</button>
  <div class="prog" id="prog">
    <div class="pbw"><div class="pb" id="pb"></div></div>
    <div class="pt" id="pt">Gerando...</div>
  </div>
  <div class="done" id="done">✓ PDF gerado com sucesso</div>
</div>

const iLogo=new Image(); iLogo.src=LOGO;
const iVessel=new Image(); iVessel.src=VESSEL;

const sy=document.getElementById('sy');
const cy=new Date().getFullYear();
for(let y=cy-1;y<=cy+2;y++){const o=document.createElement('option');o.value=y;o.textContent=y;if(y===cy)o.selected=true;sy.appendChild(o);}
document.getElementById('sm').value=new Date().getMonth();

function dims(m,y){return new Date(y,m+1,0).getDate();}
function upd(){const m=+document.getElementById('sm').value,y=+sy.value,d=dims(m,y);
  document.getElementById('inf').innerHTML=`Mês: <span>${MPT[m]} ${y}</span><br>Dias: <span>${d}</span><br>Páginas: <span>${1+d*2}</span>`;}
document.getElementById('sm').onchange=upd; sy.onchange=upd; upd();
function setP(p,t){document.getElementById('pb').style.width=p+'%';document.getElementById('pt').textContent=t;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function wkNum(d){const s=new Date(d.getFullYear(),0,1);return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);}

async function go(){
  const btn=document.getElementById('btn'); btn.disabled=true;
  document.getElementById('prog').style.display='block';
  document.getElementById('done').style.display='none';
  setP(2,'Iniciando...');await sleep(20);
  const month=+document.getElementById('sm').value, year=+sy.value, days=dims(month,year);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  drawCover(doc,month,year);
  setP(8,'Capa concluída...');await sleep(10);
  for(let d=1;d<=days;d++){
    const dt=new Date(year,month,d);
    const wday=WEN[dt.getDay()===0?6:dt.getDay()-1];
    const wk=wkNum(dt);
    doc.addPage('a4','portrait'); drawFrente(doc,d,wday,wk,MEN[month],year);
    doc.addPage('a4','portrait'); drawVerso(doc);
    setP(8+Math.round((d/days)*90),`Dia ${d} de ${days}...`);
    if(d%4===0)await sleep(4);
  }
  setP(100,'Finalizando...');await sleep(30);
  doc.save(`Genesis_I_Logbook_${MPT[month]}_${year}.pdf`);
  document.getElementById('prog').style.display='none';
  document.getElementById('done').style.display='block';
  btn.disabled=false;
}

// ── COVER ────────────────────────────────────────────────────────────────────
function drawCover(doc,month,year){
  const W=210,H=297;

  // Full page dark navy background
  doc.setFillColor(8,18,45); doc.rect(0,0,W,H,'F');

  // ── TOP TITLE BAND (0..22mm) ──
  doc.setFillColor(12,28,70); doc.rect(0,0,W,22,'F');
  // Accent line
  doc.setLineWidth(0.4); doc.setDrawColor(50,110,210);
  doc.line(10,14,W-10,14);
  // Label
  doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.setTextColor(80,130,200); doc.setCharSpace(3);
  doc.text('OPERATIONS  LOGBOOK',W/2,9,{align:'center'});
  doc.setCharSpace(0);
  // Vessel name
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.setTextColor(210,230,255);
  doc.text('MPSV GENESIS I',W/2,20,{align:'center'});

  // ── ILLUSTRATION (22..158mm, ratio 210x136) ──
  try{doc.addImage(iVessel,'JPEG',0,22,W,136,undefined,'FAST');}catch(e){}

  // ── MONTH/YEAR SECTION (158..297mm) ──
  // Thin top accent on the info section
  doc.setFillColor(30,70,180); doc.rect(0,158,W,1.5,'F');

  // Month — bold, large, light
  doc.setFont('helvetica','bold'); doc.setFontSize(36);
  doc.setTextColor(220,235,255);
  doc.text(MPT[month].toUpperCase(),W/2,188,{align:'center'});

  // Year — lighter
  doc.setFont('helvetica','normal'); doc.setFontSize(18);
  doc.setTextColor(80,130,200);
  doc.text(String(year),W/2,203,{align:'center'});

  // Separator
  doc.setLineWidth(0.4); doc.setDrawColor(30,70,180);
  doc.line(W/2-25,208,W/2+25,208);

  // Sub-label
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.setTextColor(60,100,160); doc.setCharSpace(1.5);
  doc.text('BRIDGE  OPERATIONS  LOGBOOK',W/2,218,{align:'center'});
  doc.setCharSpace(0);

  // Bottom line
  doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
  doc.setTextColor(40,70,130);
  doc.text('Prio Forte S.A.',W/2,285,{align:'center'});
  doc.setLineWidth(0.3); doc.setDrawColor(30,60,120);
  doc.line(8,290,W-8,290);
  doc.setTextColor(30,60,120); doc.setFontSize(6);
  doc.text(`${MPT[month]} ${year}  ·  Genesis I Operations`, W/2, 295, {align:'center'});
}

// ── FRENTE ───────────────────────────────────────────────────────────────────
// jsPDF: Y=0 is TOP, increases downward. cy starts at M and grows.
function drawFrente(doc,day,weekday,weekN,monthEn,year){
  const W=210,H=297,M=7,TW=W-2*M;
  doc.setFillColor(255,255,255); doc.rect(0,0,W,H,'F');
  doc.setDrawColor(0,0,0); doc.setTextColor(0,0,0);

  function cell(x,y,w,h,txt,opts){
    opts=opts||{};
    const bold=opts.bold||false, sz=opts.sz||7, lw=opts.lw||0.3, al=opts.al||'center';
    const tc=opts.tc||[0,0,0], fill=opts.fill||null;
    if(fill){doc.setFillColor(...fill); doc.rect(x,y,w,h,'F');}
    doc.setDrawColor(0,0,0); doc.setLineWidth(lw); doc.rect(x,y,w,h,'S');
    if(txt){
      doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(sz); doc.setTextColor(...tc);
      const ty=y+h*0.62;
      if(al==='center') doc.text(txt,x+w/2,ty,{align:'center'});
      else doc.text(txt,x+1,ty);
    }
  }

  // cy starts at top margin, grows downward
  let cy=M;

  // ── HEADER ──
  const hh=8.5;
  const wD=16,wW=48,wWk=22,wMo=22,wV=TW-wD-wW-wWk-wMo;
  let hx=M;
  [[wD,'DAY',String(day)],[wW,'WEEKDAY',weekday],[wWk,'WEEK',String(weekN)],[wMo,'MONTH',''],[wV,'',monthEn]].forEach(([w,lbl,val])=>{
    cell(hx,cy,w,hh,'',{lw:0.6});
    if(lbl){doc.setFont('helvetica','bold');doc.setFontSize(5);doc.setTextColor(0,0,0);doc.text(lbl,hx+w/2,cy+hh*0.30,{align:'center'});}
    if(val){doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text(val,hx+w/2,cy+hh*0.68,{align:'center'});}
    hx+=w;
  }); cy+=hh;

  // ── DUTY ARRANGEMENT ──
  const sh=5.5;
  cell(M,cy,TW,sh,'BRIDGE OFFICERS DUTY ARRANGEMENT',{bold:true,sz:8,fill:[212,212,222],lw:0.6}); cy+=sh;
  const dh=5,wTi=20,wTo=20,wFn=TW-wTi-wTo-48-26,wSn=48,wRk=26;
  hx=M; [[wTi,'Time in'],[wTo,'Time out'],[wFn,'First name'],[wSn,'Surname'],[wRk,'Rank']].forEach(([w,l])=>{cell(hx,cy,w,dh,l,{bold:true,sz:6.5,lw:0.3});hx+=w;}); cy+=dh;
  [['0:00','12:00'],['6:00','18:00'],['12:00','24:00'],['18:00','6:00']].forEach(([ti,to])=>{
    hx=M; [[wTi,ti],[wTo,to],[wFn,''],[wSn,''],[wRk,'']].forEach(([w,v])=>{cell(hx,cy,w,5,v,{bold:true,sz:7,lw:0.2});hx+=w;}); cy+=5;
  });

  // ── ROTATION CHECKLIST ──
  cell(M,cy,TW,sh,'BRIDGE OFFICERS ROTATION CHECKLIST',{bold:true,sz:8,fill:[212,212,222],lw:0.6}); cy+=sh;
  const wh=4.5,leftW=Math.round(TW*0.63),rightW=TW-leftW;
  cell(M,cy,leftW,wh,'When taking-over',{bold:true,sz:7,fill:[230,230,240],lw:0.4});
  cell(M+leftW,cy,rightW,wh,'When handing-over',{bold:true,sz:7,fill:[230,230,240],lw:0.4}); cy+=wh;

  const nCols=16, colW=leftW/nCols;
  const lx=i=>M+i*colW;

  // Header row 1
  const hr1=3.8;
  [[0,2,'Time on desk'],[2,4,'Scintillation'],[4,5,'Mode'],[5,7,'Wind'],[7,9,'Current'],
   [9,10,'Velocity'],[10,11,'Hdg'],[11,12,'ROT'],[12,13,'COR'],[13,16,'Gains']].forEach(([s,e,l])=>{
    const x0=lx(s),w0=lx(e)-lx(s);
    doc.setLineWidth(0.25);doc.setDrawColor(0,0,0);doc.rect(x0,cy,w0,hr1,'S');
    doc.setFont('helvetica','normal');doc.setFontSize(4);doc.setTextColor(0,0,0);
    doc.text(l,x0+w0/2,cy+hr1*0.62,{align:'center'});
  });
  // "Changes" spans hr1+hr2 — draw after hr2 is known
  const hr2=3.2;
  doc.setLineWidth(0.5);doc.rect(M+leftW,cy,rightW,hr1+hr2,'S');
  doc.setFont('helvetica','normal');doc.setFontSize(5);
  doc.text('Changes from taking-over situation',M+leftW+rightW/2,cy+(hr1+hr2)*0.55,{align:'center'});
  cy+=hr1;

  // Header row 2
  ['hh:mm','Actual','next h.','DP JS Man.','Dir °','Spd kn','Dir °','T/kn','kn','°','°','#','F/A','P/S','Hdg','KGL'].forEach((l,i)=>{
    doc.setLineWidth(0.18);doc.rect(lx(i),cy,colW,hr2,'S');
    doc.setFont('helvetica','normal');doc.setFontSize(3.8);doc.setTextColor(0,0,0);
    doc.text(l,lx(i)+colW/2,cy+hr2*0.62,{align:'center'});
  }); cy+=hr2;

  // ── 24 hourly rows (top-down: 00:00 first) ──
  const bottomH=30, avail=H-M-cy-bottomH;
  const trh=Math.max(avail/24,2.5);
  for(let h=0;h<24;h++){
    const ry=cy+h*trh, hstr=String(h).padStart(2,'0')+':00';
    doc.setLineWidth(0.5);doc.setDrawColor(0,0,0);doc.rect(M,ry,colW*2,trh,'S');
    doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(0,0,0);
    doc.text(hstr,M+0.8,ry+trh*0.62);
    for(let col=2;col<16;col++){doc.setLineWidth(0.12);doc.rect(lx(col),ry,colW,trh,'S');}
    doc.setLineWidth(0.12);doc.rect(M+leftW,ry,rightW,trh,'S');
  }
  cy+=24*trh;

  // ── DGs + FIRE ROUNDS ──
  const dgW=TW*0.55,frX=M+dgW+1,frW=TW-dgW-1;
  const s2h=5.5,h2h=4.5,rem=H-M-cy,dgrh=Math.max((rem-s2h-h2h)/5,3.5);

  // Section headers
  cell(M,cy,dgW,s2h,'DGs connected',{bold:true,sz:7,fill:[220,220,228],lw:0.6});
  doc.setLineWidth(0.6);doc.rect(frX,cy,frW,s2h,'S');
  doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(200,0,0);
  doc.text('FIRE ROUNDS (during dark Hours)',frX+frW/2,cy+s2h*0.62,{align:'center'});
  cy+=s2h;

  const dgCW=[dgW*.15,dgW*.23,dgW*.12,dgW*.15,dgW*.23,dgW*.12];
  const dgHL=['Time','Nb of running DGs','Bus Bar Op/Cl','Time','Nb of running DGs','Bus Bar Op/Cl'];
  const frCW=[frW*.18,frW*.50,frW*.32];

  // Column headers
  let dx=M;
  dgCW.forEach((cw,i)=>{
    doc.setLineWidth(0.25);doc.rect(dx,cy,cw,h2h,'S');
    doc.setFont('helvetica','normal');doc.setFontSize(4);doc.setTextColor(0,0,0);
    doc.text(dgHL[i],dx+cw/2,cy+h2h*0.62,{align:'center'}); dx+=cw;
  });
  let fx=frX;
  ['Time','NAME','Signature'].forEach((l,i)=>{
    doc.setLineWidth(0.25);doc.rect(fx,cy,frCW[i],h2h,'S');
    doc.setFont('helvetica','normal');doc.setFontSize(5);doc.setTextColor(0,0,0);
    doc.text(l,fx+frCW[i]/2,cy+h2h*0.62,{align:'center'}); fx+=frCW[i];
  });
  cy+=h2h;

  // Data rows
  for(let r=0;r<3;r++){
    let dx2=M; dgCW.forEach(cw=>{doc.setLineWidth(0.18);doc.rect(dx2,cy+r*dgrh,cw,dgrh,'S');dx2+=cw;});
  }
  ['0:00','2:00','4:00','20:00','22:00'].forEach((ft,r)=>{
    let fx2=frX;
    [ft,'NAME','Signature'].forEach((v,i)=>{
      doc.setLineWidth(0.18);doc.rect(fx2,cy+r*dgrh,frCW[i],dgrh,'S');
      doc.setFont('helvetica','normal');doc.setFontSize(5.5);doc.setTextColor(160,160,160);
      doc.text(v,fx2+frCW[i]/2,cy+r*dgrh+dgrh*0.62,{align:'center'}); fx2+=frCW[i];
    });
  });
}

// ── VERSO ────────────────────────────────────────────────────────────────────
// Y=0 is TOP. Header at top, lines flow downward.
function drawVerso(doc){
  const W=210,H=297,M=7,TW=W-2*M;
  doc.setFillColor(255,255,255); doc.rect(0,0,W,H,'F');
  doc.setDrawColor(0,0,0);
  const tW=14, txW=(TW-tW*2)/2;
  const c2x=M+tW+txW, c3x=c2x+tW;
  const hh=6.5;

  // Header row at top
  [[M,tW,'Time'],[M+tW,txW,''],[c2x,tW,'Time'],[c3x,txW,'']].forEach(([x,w,l])=>{
    doc.setLineWidth(0.6);doc.rect(x,M,w,hh,'S');
    if(l){doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(0,0,0);
      doc.text(l,x+w/2,M+hh*0.62,{align:'center'});}
  });

  // Ruled lines flowing downward from below the header
  const lineStart=M+hh;
  const lH=5.5, nL=Math.floor((H-M-lineStart)/lH);
  for(let i=0;i<nL;i++){
    const ry=lineStart+(i+1)*lH;
    doc.setLineWidth(0.12);doc.setDrawColor(0,0,0);
    doc.line(M,ry,M+tW+txW,ry); doc.line(c2x,ry,M+TW,ry);
  }

  // Outer border and vertical dividers
  doc.setLineWidth(0.6);doc.rect(M,M,TW,H-2*M,'S');
  doc.setLineWidth(0.4);
  doc.line(M+tW,M,M+tW,H-M);
  doc.line(M+tW+txW,M,M+tW+txW,H-M);
  doc.line(c3x,M,c3x,H-M);
}
